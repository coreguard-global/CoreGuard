name: npm release (gated)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to confirm publishing all 14 @coreguard packages'
        required: true
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write   # npm provenance — the published artifacts link back to this repo/workflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Confirm input + credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RELEASE" ]; then
            echo "refusing to run: type RELEASE in the confirm input to publish"; exit 1
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "refusing to run: NPM_TOKEN secret is not configured"; exit 1
          fi

      - name: Install (workspace)
        run: npm ci --ignore-scripts

      - name: Credential diagnostics (no secret values)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          echo "registry: $(npm config get registry)"
          echo -n "authenticated as: "
          npm whoami || echo "(whoami failed — token not accepted)"
          npm config get //registry.npmjs.org/:_authToken | sed 's/./*/g' | wc -c

      - name: Gate — release-please (publish-check + plan + publish)
        env:
          # setup-node writes .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`;
          # passing only NPM_TOKEN left the publish step unauthenticated and the registry
          # answered 404 on PUT (run 45028993970). Both names carry the same secret.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-please.mjs
