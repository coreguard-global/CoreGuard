name: npm release (gated)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to confirm publishing all 14 @coreguard packages'
        required: true
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write   # npm provenance + MCP registry GitHub OIDC (no MCP registry secret needed)
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Confirm input + credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RELEASE" ]; then
            echo "refusing to run: type RELEASE in the confirm input to publish"; exit 1
          fi
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "refusing to run: NPM_TOKEN secret is not configured"; exit 1
          fi

      - name: Install (workspace)
        run: npm ci --ignore-scripts

      - name: Credential diagnostics (no secret values)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          echo "registry: $(npm config get registry)"
          echo -n "authenticated as: "
          npm whoami || echo "(whoami failed — token not accepted)"
          npm config get //registry.npmjs.org/:_authToken | sed 's/./*/g' | wc -c

      - name: Gate — release-please (publish-check + plan + publish)
        env:
          # setup-node writes .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`;
          # passing only NPM_TOKEN left the publish step unauthenticated and the registry
          # answered 404 on PUT (run 45028993970). Both names carry the same secret.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-please.mjs

      - name: Publish MCP registry (GitHub OIDC - no MCP registry secret required)
        env:
          # Exact secret name required for MCP registry publishing: NONE.
          # This workflow uses GitHub OIDC (id-token: write) for MCP registry auth.
          # The only repository/environment secret required by this workflow is NPM_TOKEN.
          MCP_PUBLISHER_VERSION: ${{ env.MCP_PUBLISHER_VERSION }}
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./packages/agent-commerce/package.json').version")
          SERVER_VERSION=$(node -p "require('./packages/agent-commerce/server.json').version")
          PKG0_VERSION=$(node -p "require('./packages/agent-commerce/server.json').packages[0].version")
          if [ "$PKG_VERSION" != "$SERVER_VERSION" ] || [ "$PKG_VERSION" != "$PKG0_VERSION" ]; then
            echo "refusing: agent-commerce version mismatch package=$PKG_VERSION server=$SERVER_VERSION package0=$PKG0_VERSION"
            exit 1
          fi
          echo "verifying @coreguard/agent-commerce@$PKG_VERSION is available on npm"
          npm view "@coreguard/agent-commerce@$PKG_VERSION" version
          curl -LfsS "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o /tmp/mcp-publisher.tar.gz
          curl -LfsS "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz.sigstore.json" -o /tmp/mcp-publisher.tar.gz.sigstore.json
          if ! command -v cosign >/dev/null 2>&1; then
            COSIGN_VERSION="v2.5.3"
            curl -LfsS "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64" -o /tmp/cosign
            sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          fi
          cosign verify-blob \
            --bundle /tmp/mcp-publisher.tar.gz.sigstore.json \
            --certificate-identity-regexp "https://github.com/modelcontextprotocol/registry/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp mcp-publisher
          chmod +x /tmp/mcp-publisher
          cd packages/agent-commerce
          /tmp/mcp-publisher login github-oidc
          /tmp/mcp-publisher publish
          echo "MCP registry publish completed for @coreguard/agent-commerce@$PKG_VERSION"
