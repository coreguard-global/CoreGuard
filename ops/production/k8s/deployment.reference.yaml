# REFERENCE ONLY - NOT_PROVISIONED
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cgcp-control-plane
  labels: { app: cgcp-control-plane }
spec:
  replicas: 2
  selector:
    matchLabels: { app: cgcp-control-plane }
  template:
    metadata:
      labels: { app: cgcp-control-plane }
    spec:
      containers:
        - name: cgcp
          image: ghcr.io/coreguard-global/coreguard-cgcp:REPLACE_ME
          ports: [{ containerPort: 8787 }]
          envFrom:
            - configMapRef: { name: cgcp-config }
            - secretRef: { name: cgcp-secrets }
          readinessProbe:
            httpGet: { path: /health, port: 8787 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8787 }
            initialDelaySeconds: 10
            periodSeconds: 20
