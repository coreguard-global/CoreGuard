# REFERENCE ONLY - NOT_PROVISIONED / NOT_HA
# Local integration shape for developers. Do not treat as production HA.
version: "3.9"
services:
  postgres-primary:
    image: postgres:16
    environment:
      POSTGRES_DB: cgcp
      POSTGRES_USER: cgcp
      POSTGRES_PASSWORD: cgcp_dev_only
    ports: ["5432:5432"]
    volumes: ["pg_primary:/var/lib/postgresql/data"]
  postgres-replica:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: cgcp_dev_only
    command: ["bash","-c","echo 'REFERENCE ONLY: configure real replication in managed env'; sleep infinity"]
  otel-collector:
    image: otel/opentelemetry-collector:0.101.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.reference.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4318:4318"]
  cgcp:
    image: node:22-alpine
    working_dir: /app
    volumes: [".:/app"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://cgcp:cgcp_dev_only@postgres-primary:5432/cgcp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: ["node","packages/agent-commerce/control-plane-cli.mjs","serve","--port","8787"]
    ports: ["8787:8787"]
    depends_on: [postgres-primary, otel-collector]
volumes:
  pg_primary: {}
